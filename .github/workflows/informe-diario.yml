name: Informe diario

# Alternativa con clave de API de Anthropic. La edición diaria la hace hoy una
# tarea programada de Claude (ver CLAUDE.md). Para usar este flujo en su lugar,
# cree el secreto ANTHROPIC_API_KEY y descomente "schedule".
on:
  # schedule:
  #   - cron: "43 10 * * *"   # 5:43 a. m. hora de Bogotá
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: informe-diario
  cancel-in-progress: false

jobs:
  generar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      - name: Generar informe
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/generate.mjs

      - name: Publicar en el repositorio
        run: |
          git config user.name "informe-diario[bot]"
          git config user.email "informe-diario@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Sin cambios."
          else
            git commit -m "Informe diario $(TZ=America/Bogota date +%F)"
            git push
          fi
